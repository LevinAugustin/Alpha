plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.isFile()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingPolicy = new Properties()
def signingPolicyFile = rootProject.file('signing-policy.properties')
if (signingPolicyFile.isFile()) {
    signingPolicyFile.withInputStream { signingPolicy.load(it) }
}
def productionApplicationId = signingPolicy.getProperty(
    'productionApplicationId',
    'com.levinaugustin.alpha',
)

android {
    namespace "com.presley.flexify"
    compileSdkVersion 37
    ndkVersion = "28.2.13676358"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId productionApplicationId
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Reproducible builds configuration
    packagingOptions {
        // Exclude files that can cause reproducibility issues
        excludes += ['META-INF/DEPENDENCIES']
        excludes += ['META-INF/LICENSE']
        excludes += ['META-INF/LICENSE.txt']
        excludes += ['META-INF/NOTICE']
        excludes += ['META-INF/NOTICE.txt']
        excludes += ['LICENSE-junit.txt']
        excludes += ['META-INF/services/U1.a']
        excludes += ['META-INF/services/U1.b']
        excludes += ['META-INF/services/X1.a']
        excludes += ['META-INF/services/X1.b']
        // Ensure deterministic ordering
        pickFirsts += ['**/libc++_shared.so']
        pickFirsts += ['**/libjsc.so']
        // Exclude problematic directories
        excludes += ['androidx/**']
        excludes += ['junit/**']
    }

   signingConfigs {
       release {
           if (keystorePropertiesFile.isFile()) {
               keyAlias keystoreProperties['keyAlias']
               keyPassword keystoreProperties['keyPassword']
               storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
               storePassword keystoreProperties['storePassword']
           }
       }
   }
   buildTypes {
       profile {
           if (keystorePropertiesFile.isFile()) {
               signingConfig signingConfigs.release
           }
           buildConfigField "long", "BUILD_TIME", "0L"
       }
       debug {
           if (keystorePropertiesFile.isFile()) {
               signingConfig = signingConfigs.release
           }
           buildConfigField "long", "BUILD_TIME", "0L"
       }
       release {
           if (keystorePropertiesFile.isFile()) {
               signingConfig signingConfigs.release
           }
           buildConfigField "long", "BUILD_TIME", "0L"
       }
   }
   tasks.configureEach { task ->
       if (task.name ==~ /(?i).*(release|profile).*/) {
           task.doFirst {
               if (!keystorePropertiesFile.isFile()) {
                   throw new GradleException('Release and profile builds need android/key.properties and the release keystore. They do not fall back to the debug key.')
               }
               def storeName = keystoreProperties['storeFile']
               if (storeName == null || !file(storeName).isFile()) {
                   throw new GradleException('Release and profile builds need the release keystore named in android/key.properties. They do not fall back to the debug key.')
               }
           }
       }
   }
   // https://github.com/brandonp2412/Flexify/issues/125
   dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 100 + abiVersionCode
        } else if (output.getFilter(com.android.build.OutputFile.ABI) == null) {
            // This is a universal APK
            output.versionCodeOverride = variant.versionCode * 100 + 3
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Flutter generates a release registrant for integration_test but omits its dev-only classpath.
    releaseImplementation project(':integration_test')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Flutter's integration_test plugin currently pins these compatible versions.
    androidTestImplementation 'androidx.test:core:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
}
